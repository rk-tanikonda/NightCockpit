name: Check source and macOS build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check, test, build and verify without installing
        run: bash check.command
      - name: Compile native helper without changing system settings
        run: |
          source scripts/lib/common.sh
          source scripts/lib/build.sh
          require_macos
          build_lock_tool
